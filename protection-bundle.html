<!DOCTYPE html>
<html lang="en-AU">
<head>

        .btn-stripe { display:block; background:#1a2a6c; color:white; padding:22px; border-radius:14px; text-decoration:none; font-weight:700; margin:30px auto 0; }
    </style>
</head>

        </div>

    </div>

    <!-- SHARED FOOTER -->

</body>
</html>
